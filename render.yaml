{
  "name": "ollalink-relay",
  "description": "Ollalink WebSocket relay server for WebRTC signaling + MSE video fallback",
  "type": "web_service",
  "env": "node",
  "region": "oregon",
  "plan": "free",
  "healthCheckPath": "/health",
  "autoDeploy": true,
  "root": "apps/relay",
  "buildCommand": "npm install && npm run build",
  "startCommand": "node dist/index.js",
  "envVars": [
    { "key": "PORT", "value": "10000" }
  ]
}