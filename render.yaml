{
  "name": "ollalink-relay",
  "description": "Ollalink WebSocket relay server for WebRTC signaling + MSE video fallback",
  "type": "web_service",
  "env": "docker",
  "region": "oregon",
  "plan": "free",
  "healthCheckPath": "/health",
  "autoDeploy": true,
  "dockerfilePath": "apps/relay/Dockerfile",
  "dockerContext": "apps/relay",
  "envVars": [
    { "key": "PORT", "value": "8080" }
  ]
}