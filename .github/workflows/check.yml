name: Check
on:
  push:
    paths:
      - '**'
jobs:
  check:
    runs-on: ubuntu-latest
    env:
      SKIP_ENV_VALIDATION: "1"
      NEXT_PUBLIC_CONVEX_URL: "https://good-kingfisher-535.convex.cloud"
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install
      - name: 🔦 Run linter
        run: bun run lint
      - name: 🪐 Check TypeScript
        run: bun run typecheck